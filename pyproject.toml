[project]
name = "claude-speaks"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pocket-tts>=3.3",
    "sounddevice>=0.5.6",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
# uv run --no-project --with pytest pytest  (speak.py is standard library only)
pythonpath = ["."]
testpaths = ["tests"]
